<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>momo OTP</title>
  <meta name="description" content="momo OTP">
  <meta property="og:title" content="momo OTP">
  <meta property="og:description" content="momo OTP">
  <meta property="og:site_name" content="momo OTP">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <header class="bar">
    <span class="bar-left"></span>
    <h1>momo OTP</h1>
    <div class="bar-right">
      <label class="icon-btn" title="上傳 QR 圖片">
        +
        <input id="fileQr" type="file" accept="image/*" hidden>
      </label>
      <button type="button" class="icon-btn" id="btnDel" title="刪除目前選取">🗑</button>
      <button type="button" class="btn-sync" id="btnSync">校時</button>
      <button type="button" class="icon-btn" id="btnGear" title="GitHub 設定">⚙</button>
    </div>
  </header>
  <p class="status" id="status"></p>
  <main id="list"></main>
  <p class="hint" id="hint"></p>
  <p class="save-warn hidden" id="saveWarn"></p>
  <p class="center"><button type="button" class="retry hidden" id="btnRetry">再存進 GitHub</button></p>

  <section class="shop" id="shop">
    <header class="bar shop-bar">
      <span class="shop-spacer"></span>
      <h2>登入管理</h2>
      <div class="bar-right">
        <label class="shop-pill">新增<input id="shopFile" type="file" accept="image/*" hidden></label>
        <button type="button" class="shop-pill" id="shopSync">校時</button>
      </div>
    </header>
    <div class="shop-body">
      <div id="shopList"></div>
      <p class="shop-hint" id="shopHint"></p>
    </div>
  </section>

  <dialog id="dlgShop">
    <form id="shopForm" method="dialog">
      <h2>新增 momo 店+</h2>
      <p class="dlg-msg" id="shopMsg"></p>
      <label>店編<input id="sCode" type="text" maxlength="20" placeholder="TP0010178"></label>
      <label>使用人<input id="sUser" type="text" maxlength="20" placeholder="許峻瑋"></label>
      <label>FIDO 通行金鑰
        <select id="sFido">
          <option value="2">尚未啟用</option>
          <option value="0" selected>暫停服務</option>
          <option value="1">已啟用</option>
        </select>
      </label>
      <label class="check"><input id="sLogin" type="checkbox" checked> 目前登入</label>
      <menu>
        <button type="button" id="shopCancel">取消</button>
        <button type="submit" class="primary">儲存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlg">
    <form id="dlgForm" method="dialog">
      <h2>新增／確認帳號</h2>
      <p class="dlg-msg" id="dlgMsg"></p>
      <label>統編<input id="fTax" type="text" inputmode="numeric" maxlength="8" placeholder="27365925"></label>
      <label>廠編<input id="fVendor" type="text" inputmode="numeric" maxlength="6" placeholder="014109"></label>
      <label>使用人<input id="fPerson" type="text" maxlength="20" placeholder="許峻瑋"></label>
      <menu>
        <button type="button" id="dlgCancel">取消</button>
        <button type="submit" class="primary" id="dlgOk">儲存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlgGh">
    <form id="ghForm" method="dialog">
      <h2>GitHub 寫回設定</h2>
      <p class="hint" id="ghHint" style="text-align:left;margin:0 0 .6rem"></p>
      <label>owner<input id="fOwner" type="text" placeholder="你的 GitHub 帳號"></label>
      <label>repo<input id="fRepo" type="text" placeholder="scm-otp"></label>
      <label>branch<input id="fBranch" type="text" placeholder="main"></label>
      <label>vault 路徑<input id="fVaultPath" type="text" placeholder="docs/vault.json"></label>
      <label>Personal Access Token（contents:write）<input id="fToken" type="password" autocomplete="off"></label>
      <p class="dlg-msg" id="ghMsg"></p>
      <menu>
        <button type="button" id="ghCancel">關閉</button>
        <button type="submit" class="primary">記住這個分頁</button>
      </menu>
    </form>
  </dialog>

  <script src="./jsQR.js?v=20261006"></script>
  <script src="./app.js?v=20261006"></script>
</body>
</html>
